name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate question banks
        run: npm run validate

      - name: Smoke test (server boots and serves all pages)
        run: |
          PORT=3999 node server/index.js &
          SERVER_PID=$!

          for i in $(seq 1 30); do
            if curl -sf -o /dev/null http://localhost:3999/; then
              break
            fi
            sleep 1
          done

          curl -f -o /dev/null http://localhost:3999/
          curl -f -o /dev/null http://localhost:3999/menu.html
          curl -f -o /dev/null http://localhost:3999/solo.html
          curl -f -o /dev/null http://localhost:3999/multiplayer-battle.html
          curl -f -o /dev/null http://localhost:3999/multiplayer-coop.html

          kill $SERVER_PID
